[package]
name = "lightning-ledger"
version = "0.2.0"
edition = "2024"
description = "Which coding-agent harness + model pair works best for which task, from your own local session logs"
license = "MIT"
repository = "https://github.com/danzang100/lightning"
readme = "README.md"
keywords = ["claude-code", "codex", "llm", "agents", "cost"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["tests/fixtures/**", "docs/specs/**", "npm/**", ".github/**"]

[lib]
name = "lightning"
path = "src/lib.rs"

[[bin]]
name = "lightning"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
toml = "1.1.8"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
